[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localscribe"
version = "0.1.0"
description = "Offline file transcription and speaker diarization for Apple Silicon"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi", "uvicorn", "python-multipart", "pydantic>=2", "psutil"]

[project.optional-dependencies]
models = ["mlx-whisper", "pyannote.audio>=4,<5", "huggingface-hub", "soundfile"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "srt", "webvtt-py"]

[project.scripts]
localscribe = "localscribe.launcher:main"
localscribe-models = "localscribe.models:main"
localscribe-spike = "localscribe.spike:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/localscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
